# Every guide must build and its model must hold together: no parts through each other, closed or open, and no
# floating fittings (scripts/jysk/check.ts, then scripts/qa/overlaps.ts). Vercel runs the same check before it deploys.
name: QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guides:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run -s jysk:check
